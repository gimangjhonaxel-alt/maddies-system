{% extends "base.html" %}

{% block title %}Maddie's | {{ title }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold" style="color: var(--maddies-brown);">{{ code }}</div>
    <h2 class="mb-3">{{ title }}</h2>
    <p class="lead text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-maddies me-2">Back to home</a>
    <a href="{{ url_for('products.menu') }}" class="btn btn-outline-secondary">See the menu</a>
</div>
{% endblock %}
